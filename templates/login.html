<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TripGenie</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef7ff, #f8f5ff);
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .navbar {
            height: 72px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            text-decoration: none;
            font-size: 25px;
            font-weight: 700;
            color: #1d3557;
        }

        .logo span {
            color: #4f8cff;
        }

        .home-link {
            text-decoration: none;
            color: #4f8cff;
            font-weight: 600;
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 45px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(35, 65, 100, 0.12);
        }

        .icon {
            text-align: center;
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            color: #1d3557;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #4f8cff;
            box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.1);
        }

        /* BUTTON */

        .login-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3978f6, #6c63ff);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 140, 255, 0.3);
        }

        /* DIVIDER */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #aaa;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #eee;
            flex: 1;
        }

        /* SIGNUP */

        .signup-text {
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .signup-text a {
            color: #4f8cff;
            text-decoration: none;
            font-weight: 600;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 18px;
            color: #888;
            font-size: 12px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .navbar {
                padding: 0 20px;
            }

            .login-card {
                padding: 35px 25px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="/" class="logo">
            ✈️ Trip<span>Genie</span>
        </a>

        <a href="/" class="home-link">
            Home
        </a>

    </nav>


    <!-- LOGIN -->

    <main class="main">

        <div class="login-card">

            <div class="icon">
                ✈️
            </div>

            <h1>
                Welcome Back!
            </h1>

            <p class="subtitle">
                Login to continue planning your journey.
            </p>


            <form method="POST" action="/login">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login ✨
                </button>

            </form>


            <div class="divider">
                OR
            </div>


            <p class="signup-text">

                Don't have an account?

                <a href="/sigup">
                    Create Account
                </a>

            </p>

        </div>

    </main>


    <footer>
        © 2026 TripGenie. Plan smarter. Travel better.
    </footer>

</body>

</html>
